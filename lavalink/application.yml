server:
  port: 2333
  address: 127.0.0.1

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false
  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"
    sources:
      youtube: false
      bandcamp: false
      soundcloud: false
      twitch: false
      vimeo: false
      http: true
      local: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    clients:
      - ANDROID_MUSIC
      - MWEB
      - IOS
      - WEB
      - WEBEMBEDDED
      - ANDROID_VR

logging:
  level:
    root: INFO
    lavalink: INFO
