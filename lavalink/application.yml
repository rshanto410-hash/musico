      - IOS
      - TV
      - ANDROID
      - MWEB
      - ANDROID_MUSIC
      - TVHTML5_SIMPLY
      - ANDROID_VR
      - WEBEMBEDDED
      - WEB
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:1//0gS34IKvzloo1CgYIARAAGBASSQF-L9IrntdqYcCTmoaND_QVPOqcJMeafglRpSdFsCOhwbRXN_TcKK5fD6iEPM7T9OjJ9WIGAS7AA3erkTR0H0Zm4AKdnHDc5PI}"
